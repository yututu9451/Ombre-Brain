services:
  - type: web
    name: ombre-brain
    runtime: python
    region: singapore
    plan: starter          # Persistent disks need a paid plan; free instances lose every memory on redeploy
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: OMBRE_TRANSPORT
        value: streamable-http
      - key: OMBRE_PORT
        value: "10000"
      - key: OMBRE_API_KEY
        sync: false          # Set in Render dashboard > Environment (any OpenAI-compatible key)
      - key: OMBRE_BASE_URL
        sync: false          # e.g. https://api.deepseek.com/v1 or https://api.siliconflow.cn/v1
      - key: OMBRE_BUCKETS_DIR
        value: /var/data/buckets
    disk:
      name: ombre-buckets
      mountPath: /var/data
      sizeGB: 1
